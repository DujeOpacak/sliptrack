# VAŽNO: zamijeni "CHANGE_ME.duckdns.org" svugdje niže sa stvarnom DuckDNS domenom prije
# prvog pokretanja (npr. "sliptrack.duckdns.org"). Nginx ne čita .env fajl sam od sebe (to
# nije shell), pa ova zamjena mora biti ručna, jednokratna.
#
# Jedna DuckDNS domena (poddomene poddomena nisu podržane na besplatnom DuckDNS planu) —
# admin i backend razdvojeni po putu (/api/... vs /), MinIO na zasebnom portu (9443) jer
# S3 API ne dijeli dobro isti "/" korijen s admin statičnim fajlovima.

# --- HTTP (port 80): ACME challenge za Certbot + redirect na HTTPS ---
server {
    listen 80;
    server_name CHANGE_ME.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Admin web (root, "/") + backend REST API (pod "/api/") ---
server {
    listen 443 ssl;
    server_name CHANGE_ME.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME.duckdns.org/privkey.pem;

    # Uplatnica + slika u istom zahtjevu (multipart upload) — mora pratiti backendov
    # spring.servlet.multipart.max-file-size (10MB).
    client_max_body_size 10M;

    # Backend endpointi su već mapirani pod /api/... (@RequestMapping("/api/auth") itd.),
    # pa se putanja NE prepisuje — /api/auth/login stigne na backend kao /api/auth/login.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin web (statični build, sliptrack-admin/dist). SPA fallback — react-router-dom
    # (BrowserRouter) upravlja rutama na klijentu, svaki nepoznat put (npr. izravan refresh
    # na /categories) mora vratiti index.html, ne 404.
    root /var/www/admin;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- MinIO S3 API (presigned image URL-ovi), zaseban port — isti certifikat kao gore ---
server {
    listen 9443 ssl;
    server_name CHANGE_ME.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME.duckdns.org/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Presigned S3 potpisi ne smiju se dirati — bez preusmjeravanja/prepisivanja puta.
    }
}
