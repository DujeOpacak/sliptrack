# Privremena konfiguracija SAMO za prvo pokretanje — koristi se dok Certbot ne izda prvi
# certifikat (nginx ne može startati s "conf.d/app.conf" prije nego ti fajlovi postoje).
#
# Tijek: pokreni nginx s OVIM configom (zamijeni conf.d/ s ovim folderom, ili mountaj ovaj
# folder umjesto conf.d/ u docker-compose.prod.yml) -> pokreni certbot da izda certifikat
# -> vrati docker-compose.prod.yml da mounta nginx/conf.d/ (puni config sa SSL-om) -> restart
# nginxa. Detaljne naredbe idu kad budemo prolazili kroz stvarni VPS deployment.

server {
    listen 80;
    server_name CHANGE_ME.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "nginx bootstrap OK — spreman za certbot\n";
        add_header Content-Type text/plain;
    }
}
