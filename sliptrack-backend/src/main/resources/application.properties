# App
spring.application.name=sliptrack-backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sliptrack
spring.datasource.username=sliptrack
spring.datasource.password=sliptrack123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=EjRujYRnD/KJ6pjOjlgcdAzFroH/NHHe1SHCaYHC3+iQ/mFI4ea0edPnxYcdqQAJzFcbyQZCpHqDQtZUZzukQw==
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=2592000000

# MinIO
# LAN IP racunala (isti razlog kao sliptrack-mobile/src/api/config.ts) — presigned URL-ovi se
# potpisuju protiv ovog hosta, pa telefon mora moci doci do njega preko WiFi mreze, ne "localhost".
# Promijeniti ako se IP racunala promijeni (npr. druga mreza).
minio.endpoint=http://192.168.1.2:9000
minio.access-key=sliptrack
minio.secret-key=sliptrack123
minio.bucket=payment-slip-images

# Multipart upload (mora biti >= PaymentSlipImageService max file size)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Reminder job (RecurringPattern analiza + push podsjetnici) — svaki dan u 08:00
reminder.cron=0 0 8 * * *
reminder.days-ahead=3

# CORS / cookie (sliptrack-admin web klijent) — access token u memoriji, refresh token kao HttpOnly cookie
app.cors.allowed-origins=http://localhost:5173
app.cookie.secure=false