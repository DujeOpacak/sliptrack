# App
spring.application.name=sliptrack-backend
server.port=8080

# PostgreSQL
# Svaka vrijednost ima ${ENV_VAR:default} oblik — default je trenutna lokalna dev
# konfiguracija (mvnw spring-boot:run bez ijedne env varijable radi identično kao prije),
# a docker-compose.prod.yml postavlja stvarne env varijable preko .env fajla u produkciji.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sliptrack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sliptrack}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sliptrack123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
# Default ispod je i dalje isti hardkodirani dev secret kao prije (bezopasno za lokalni rad) —
# u produkciji MORA doći iz JWT_SECRET env varijable (.env, nikad u gitu).
jwt.secret=${JWT_SECRET:EjRujYRnD/KJ6pjOjlgcdAzFroH/NHHe1SHCaYHC3+iQ/mFI4ea0edPnxYcdqQAJzFcbyQZCpHqDQtZUZzukQw==}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=2592000000

# MinIO
# minio.endpoint mora biti host koji je klijent (mobitel/admin) stvarno u stanju dohvatiti —
# lokalno je to LAN IP računala (vidi sliptrack-mobile/src/api/config.ts za isti razlog), u
# produkciji je to javna MinIO poddomena (https://minio.<domena>) jer se presigned URL-ovi
# potpisuju izravno protiv ovog hosta i klijent ih posjećuje direktno, ne kroz backend.
minio.endpoint=${MINIO_ENDPOINT:http://192.168.1.2:9000}
minio.access-key=${MINIO_ACCESS_KEY:sliptrack}
minio.secret-key=${MINIO_SECRET_KEY:sliptrack123}
minio.bucket=${MINIO_BUCKET:payment-slip-images}

# Multipart upload (mora biti >= PaymentSlipImageService max file size)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Reminder job (RecurringPattern analiza + push podsjetnici) — svaki dan u 08:00
reminder.cron=0 0/1 * * * *
reminder.days-ahead=3

# CORS / cookie (sliptrack-admin web klijent) — access token u memoriji, refresh token kao HttpOnly cookie
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cookie.secure=${APP_COOKIE_SECURE:false}